    ? `<feComponentTransfer><feFuncR type="discrete" tableValues="${discreteTable(quantise)}"/><feFuncG type="discrete" tableValues="${discreteTable(quantise)}"/><feFuncB type="discrete" tableValues="${discreteTable(quantise)}"/></feComponentTransfer>`
    : `<feColorMatrix type="saturate" values="0"/>${contrast !== 1 ? `<feComponentTransfer><feFuncR type="linear" slope="${contrast}" intercept="${((1 - contrast) / 2).toFixed(3)}"/><feFuncG type="linear" slope="${contrast}" intercept="${((1 - contrast) / 2).toFixed(3)}"/><feFuncB type="linear" slope="${contrast}" intercept="${((1 - contrast) / 2).toFixed(3)}"/></feComponentTransfer>` : ''}`;
  const svg =
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}">` +
    `<filter id="f" x="0" y="0" width="100%" height="100%">` +
    `<feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="${octaves}" seed="${seed}" stitchTiles="stitch"/>` +
    table +
    `</filter>` +
    `<rect width="${size}" height="${size}" filter="url(#f)"/>` +
    `</svg>`;
  return svgDataUri(svg);
}

function discreteTable(n) {
  const vals = [];
  for (let i = 0; i < n; i++) vals.push((i / (n - 1)).toFixed(3));
  return vals.join(' ');
}

function grainOverlay(cfg, sel = '.vf-grain') {
  if (cfg.grain <= 0.01) return '';
  return `
${sel} {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: ${noiseTile({ freq: 0.85, octaves: 2, size: 160, seed: (cfg.seed % 97) + 1 })};
  background-size: 160px 160px;
  opacity: ${(cfg.grain * 0.5).toFixed(3)};
  mix-blend-mode: overlay;
  z-index: 3;
}`;
}

function baseBlock(cfg, extra = '') {
  const angle = `${cfg.direction}deg`;
  return `.vf-bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
  isolation: isolate;
  contain: paint;
  background-color: ${cfg.background};${cfg.vignette > 0.01
    ? `\n  box-shadow: inset 0 0 ${Math.round(26 + cfg.vignette * 44)}vmax ${rgbaStr('#000000', +(cfg.vignette * 0.62).toFixed(2))};`
    : ''}
  --vf-angle: ${angle};
${paletteVars(cfg)}
}${extra}`;
}

const keyframes = (name, body) => `@keyframes ${name} {\n${body}\n}`;

/** Palette sample at t∈[0,1] as hex — matches the renderer's ramp exactly. */
function rampAt(cfg, t) {
  return toHex(sampleOklabRamp(paletteToOklab(cfg.palette), t));
}

/* ------------------------------------------------------------------ mesh */

function meshCss(cfg) {
  const L = meshLayout(cfg);
  const cellR = (100 * 1.15) / L.cells;
  const layers = L.nodes.map((nd) => {
    const c = rampAt(cfg, nd.t);
    const x = (nd.x * 100).toFixed(2);
    const y = (nd.y * 100).toFixed(2);
    return `radial-gradient(circle ${cellR.toFixed(1)}vmax at ${x}% ${y}%, ${rgbaStr(c, 0.92)} 0%, ${rgbaStr(c, 0.45)} 38%, transparent 74%)`;
  });

  const ramp = rampColors(cfg, Math.min(5, Math.max(2, cfg.palette.length)));
  const blur = Math.round(16 + cfg.blur * 52);
  const d = dur(cfg, 26);
  const anim = d ? `\n  animation: vf-mesh ${d.toFixed(1)}s ease-in-out infinite alternate;` : '';
  const kf = d
    ? keyframes(
        'vf-mesh',
        `  0%   { transform: translate3d(-2.2%, -1.4%, 0) scale(1.1) rotate(-1.2deg); }
  100% { transform: translate3d(2.2%, 1.8%, 0) scale(1.16) rotate(1.4deg); }`,
      )
    : '';

  const css = `${baseBlock(cfg)}
.vf-bg > .vf-layer {
  position: absolute;
  inset: -16%;
  background-image:
    ${layers.join(',\n    ')},
    linear-gradient(var(--vf-angle), ${ramp.join(', ')});
  filter: blur(${blur}px) saturate(1.06);${anim}
  z-index: 1;
}
${grainOverlay(cfg)}
${kf}`;

  return {
    css,
    body: '<div class="vf-bg"><div class="vf-layer"></div><div class="vf-grain"></div></div>',
    approx: 'medium',
    notes: [
      `All ${L.nodes.length} lattice anchors exported at their true positions (${L.cells}×${L.cells} cells), each with the ramp colour the renderer uses.`,
      'Bilinear interpolation and the noise warp become a soft blur + slow transform drift. Boundaries are rounder than the canvas version.',
    ],
  };
}

/* ----------------------------------------------------------------- blobs */

function blobsCss(cfg) {
  const L = blobLayout(cfg);
  const minDim = '100vmin';
  const layers = L.items.map((b) => {
    const c = cfg.palette[Math.min(cfg.palette.length - 1, b.colorIdx)];
    const a = +(b.alpha * (0.45 + cfg.intensity * 0.9)).toFixed(3);
    const r = (b.radius * (0.55 + cfg.scale * 0.7) * 100).toFixed(1);
    const x = (b.bx * 100).toFixed(2);
    const y = (b.by * 100).toFixed(2);
    return `radial-gradient(circle ${r}vmin at ${x}% ${y}%, ${rgbaStr(c, a)} 0%, ${rgbaStr(c, a * 0.5)} 38%, ${rgbaStr(c, a * 0.16)} 72%, transparent 100%)`;
  });

  const d = dur(cfg, 22);
  const anim = d ? `\n  animation: vf-float ${d.toFixed(1)}s ease-in-out infinite alternate;` : '';
  const kf = d
    ? keyframes(
        'vf-float',
        `  0%   { transform: translate3d(-2.6%, 1.6%, 0) scale(1.04); }
  50%  { transform: translate3d(1.8%, -2.6%, 0) scale(1.1); }
  100% { transform: translate3d(2.6%, 1.6%, 0) scale(1.03); }`,
      )
    : '';

  const css = `${baseBlock(cfg)}
.vf-bg > .vf-layer {
  position: absolute;
  inset: -18%;
  background-image:
    ${layers.join(',\n    ')};
  mix-blend-mode: screen;
  filter: blur(${Math.round(8 + cfg.blur * 30)}px);${anim}
  z-index: 1;
}
${grainOverlay(cfg)}
${kf}`;

  return {
    css,
    body: '<div class="vf-bg"><div class="vf-layer"></div><div class="vf-grain"></div></div>',
    approx: 'high',
    notes: [
      `All ${L.count} light sources exported at their true positions, radii and palette colours.`,
      'mix-blend-mode: screen reproduces the additive bloom. The small white-hot cores are omitted — they are sub-pixel at typical sizes.',
    ],
  };
}

/* ----------------------------------------------------------------- noise */

function noiseCss(cfg) {
  const P = noiseParams(cfg);
  // Canvas samples P.freq texture tiles across the frame; the tile holds 4 lattice
  // cells, so the CSS tile must contain P.freq*4 cells stretched over 100%.
  const baseFreq = ((P.freq * 4) / TILE).toFixed(5);
  const tile = noiseTile({
    freq: baseFreq,
    octaves: P.octaves,
    size: TILE,
    seed: (cfg.seed % 251) + 1,
    contrast: 1.35,
  });
  const ramp = rampColors(cfg, 6);
  const d = dur(cfg, 34);
  const anim = d ? `\n  animation: vf-drift ${d.toFixed(1)}s linear infinite;` : '';
  const kf = d
    ? keyframes(
        'vf-drift',
        `  0%   { background-position: 0 0, 0 0; }
  100% { background-position: ${Math.round(TILE * 0.62)}px ${Math.round(TILE * 0.34)}px, 0 0; }`,
      )
    : '';

  const css = `${baseBlock(cfg)}
.vf-bg > .vf-layer {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--vf-angle), ${ramp.join(', ')}),
    ${tile};
  background-size: 100% 100%, ${Math.round(100 / Math.max(0.2, P.freq))}% ${Math.round(100 / Math.max(0.2, P.freq))}%;
  background-blend-mode: color, normal;
  filter: contrast(${(0.85 + cfg.intensity * 0.85).toFixed(2)}) brightness(0.72);${anim}
  z-index: 1;
}
${grainOverlay(cfg)}
${kf}`;

  return {
    css,
    body: '<div class="vf-bg"><div class="vf-layer"></div><div class="vf-grain"></div></div>',
    approx: 'medium',
    notes: [
      'Feature scale, octave count and palette mapping are carried over (background-blend-mode: color applies the ramp to the turbulence luminance).',
      'feTurbulence is not the engine’s fBm realisation, so cloud shapes differ while density and tone match. Compare SSIM/tone figures in verify/out/report.md.',
    ],
  };
}

/* ------------------------------------------------------------------ flow */

function flowCss(cfg) {
  const P = flowParams(cfg);
  const ramp = rampColors(cfg, 4);
  const bands = Math.max(2, Math.round(P.bands * 2));
  const stops = [];
  for (let i = 0; i <= bands; i++) {
    stops.push(`${ramp[i % ramp.length]} ${((i / bands) * 100).toFixed(2)}%`);
  }
  const d = dur(cfg, 30);
  const anim = d ? `\n  animation: vf-flow ${d.toFixed(1)}s ease-in-out infinite alternate;` : '';
  const kf = d
    ? keyframes(
        'vf-flow',
        `  0%   { transform: rotate(-1.6deg) scale(1.14) translate3d(-1.6%, 0, 0); }
  100% { transform: rotate(1.6deg) scale(1.2) translate3d(1.6%, 0, 0); }`,
      )
    : '';

  const css = `${baseBlock(cfg)}
.vf-bg > .vf-layer {
  position: absolute;
  inset: -26%;
  background-image:
    repeating-linear-gradient(var(--vf-angle), ${stops.join(', ')});
  filter: blur(${Math.round(20 + cfg.blur * 44)}px) saturate(1.12) brightness(0.78);${anim}
  z-index: 1;
}
${grainOverlay(cfg)}
${kf}`;

  return {
    css,
    body: '<div class="vf-bg"><div class="vf-layer"></div><div class="vf-grain"></div></div>',
    approx: 'low',
    notes: [
      `Band count (${Math.round(P.bands)} cycles across the frame) and direction carried over from the renderer.`,
      'CSS bands are straight before blur; the canvas folds them with a noise phase warp, so expect a calmer, more regular flow.',
    ],
  };
}

/* ------------------------------------------------------------- particles */

function particlesCss(cfg) {
  const L = particleLayout(cfg);
  const max = 56;
  const step = Math.max(1, Math.ceil(L.count / max));
  const picked = L.items.filter((_, i) => i % step === 0);
  const scaleFactor = 0.7 + cfg.scale * 0.55;

  const dots = picked.map((p) => {
    const c = cfg.palette[Math.min(cfg.palette.length - 1, p.colorIdx)];
    const r = Math.max(0.35, (p.size * scaleFactor) / 300 * 100).toFixed(2);
    const a = (0.5 + Math.min(0.5, p.size / 3)).toFixed(2);
    return `radial-gradient(circle at ${(p.bx * 100).toFixed(2)}% ${(p.by * 100).toFixed(2)}%, ${rgbaStr(c, +a)} 0 ${r}vmin, transparent ${(r * 2.4).toFixed(2)}vmin)`;
  });

  const d = dur(cfg, 40);
  const dx = (Math.cos((cfg.direction * Math.PI) / 180) * 7).toFixed(1);
  const dy = (Math.sin((cfg.direction * Math.PI) / 180) * 7).toFixed(1);
  const anim = d ? `\n  animation: vf-motes ${d.toFixed(1)}s ease-in-out infinite alternate;` : '';
  const kf = d
    ? keyframes(
        'vf-motes',
        `  0%   { transform: translate3d(0, 0, 0); }
  100% { transform: translate3d(${dx}%, ${dy}%, 0); }`,
      )
    : '';

  const c1 = cfg.palette[1] || cfg.palette[0];
  const c2 = cfg.palette[2] || c1;
  const wash = `radial-gradient(78vmax 78vmax at 46% 40%, ${rgbaStr(c2, +(0.2 + cfg.intensity * 0.34).toFixed(3))} 0%, ${rgbaStr(c1, +(0.13 + cfg.intensity * 0.2).toFixed(3))} 55%, ${rgbaStr(c1, 0)} 100%)`;

  const css = `${baseBlock(cfg)}
.vf-bg > .vf-wash {
  position: absolute;
  inset: 0;
  background-image: ${wash};
  z-index: 0;
}
.vf-bg > .vf-layer {
  position: absolute;
  inset: -10%;
  background-image:
    ${dots.join(',\n    ')};
  filter: blur(${(cfg.blur * 1.4).toFixed(2)}px);${anim}
  z-index: 1;
}
${grainOverlay(cfg)}
${kf}`;

  return {
    css,
    body: '<div class="vf-bg"><div class="vf-wash"></div><div class="vf-layer"></div><div class="vf-grain"></div></div>',
    approx: 'high',
    notes: [
      `${picked.length} of ${L.count} motes exported (every ${step === 1 ? '1st' : `${step}th`}), each at its true seeded position — past ~56 gradients per layer the CSS raster cost outruns a canvas.`,
      'Motion is one group translation: per-mote velocity, per-mote wobble and motion streaks are not expressible without JavaScript. Use the Canvas export when motion fidelity matters.',
    ],
  };
}

/* --------------------------------------------------------------- texture */

function textureCss(cfg) {
  const P = textureParams(cfg);
  const strata = Math.max(3, Math.round(P.strata));
  const baseFreq = ((P.freq * 4) / TILE).toFixed(5);
  const tile = noiseTile({
    freq: baseFreq,
    octaves: 4,
    size: TILE,
    seed: (cfg.seed % 199) + 1,
    quantise: strata,
  });
  const ramp = rampColors(cfg, 5);
  const d = dur(cfg, 44);
  const anim = d ? `\n  animation: vf-strata ${d.toFixed(1)}s ease-in-out infinite alternate;` : '';
  const kf = d
    ? keyframes(
        'vf-strata',
        `  0%   { background-position: 0 0, 0 0; }
  100% { background-position: ${Math.round(TILE * 0.18)}px ${Math.round(TILE * 0.1)}px, 0 0; }`,
      )
    : '';

  const css = `${baseBlock(cfg)}
.vf-bg > .vf-layer {
  position: absolute;
  inset: -6%;
  background-image:
    linear-gradient(var(--vf-angle), ${ramp.join(', ')}),
    ${tile};
  background-size: 100% 100%, ${Math.round(100 / Math.max(0.2, P.freq))}% ${Math.round(100 / Math.max(0.2, P.freq))}%;
  background-blend-mode: color, normal;
  filter: contrast(${(0.9 + cfg.intensity * 0.9).toFixed(2)}) brightness(0.6);${anim}
  z-index: 1;
}
${grainOverlay(cfg)}
${kf}`;

  return {
    css,
    body: '<div class="vf-bg"><div class="vf-layer"></div><div class="vf-grain"></div></div>',
    approx: 'low',
    notes: [
      `Strata count carried over exactly (${strata} discrete levels via feComponentTransfer).`,
      'feTurbulence uses a different gradient lattice than the engine’s ridged Perlin field, so folds differ while band frequency and direction match.',
    ],
  };
}

const CSS_BUILDERS = {
  mesh: meshCss,
  noise: noiseCss,
  blobs: blobsCss,
  flow: flowCss,
  particles: particlesCss,
  texture: textureCss,
};

function buildCssExport(config) {
  const cfg = prepare(config);
  const builder = CSS_BUILDERS[cfg.generator] || meshCss;
  const out = builder(cfg);
  const title = `VeilForge · ${cfg.generator} · CSS`;

  const html = PAGE_SHELL(
    title,
    out.css,
    out.body,
    `<!-- Generated by VeilForge from config seed ${cfg.seed}. No JavaScript. -->`,
  );

  const snippet = `<!-- markup -->\n${out.body}\n\n<!-- styles -->\n<style>\n${out.css}\n</style>`;

  return {
    format: 'css',
    mime: 'text/css',
    approx: out.approx,
    notes: out.notes,
    files: [
      { name: `veilforge-${cfg.generator}.css`, mime: 'text/css', text: out.css },
      { name: `veilforge-${cfg.generator}.html`, mime: 'text/html', text: html },
    ],
    snippet,
    primary: `veilforge-${cfg.generator}.html`,
  };
}

/* ---- src/export/svg.js ---- */
/**
 * SVG export.
 *
 * SVG has real filters, so this target is far more faithful than CSS:
 *
 *   noise / texture → feTurbulence + feComponentTransfer whose tableValues are
 *                     sampled from the palette itself, so the colour mapping is
 *                     the one the canvas uses
 *   flow            → gradient displaced by feTurbulence (feDisplacementMap)
 *   mesh / blobs    → radial gradients placed at the renderer's real anchors
 *   particles       → circles at the renderer's real mote positions
 *
 * Geometry comes from `layout.js`, so counts and positions match the canvas.
 * Animation is SMIL, which Chrome, Firefox and Safari all implement; it does not
 * honour prefers-reduced-motion inside a standalone file, and that is stated in
 * the notes rather than papered over.
 */






const W = 1600;
const H = 900;

function dims(cfg) {
  const ratio = ASPECTS[cfg.aspect] || 16 / 9;
  if (ratio >= 1) return { w: W, h: Math.round(W / ratio) };
  return { w: Math.round(H * ratio), h: H };
}

function channelTable(cfg, ch, n = 8) {
  const labs = paletteToOklab(cfg.palette);
  const out = [];
  for (let i = 0; i < n; i++) out.push((sampleOklabRamp(labs, i / (n - 1))[ch] / 255).toFixed(4));
  return out.join(' ');
}

function grainFilter(cfg, id = 'grain') {
  if (cfg.grain <= 0.01) return '';
  return `<filter id="${id}" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="${(cfg.seed % 89) + 1}" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>`;
}

function grainRect(cfg, w, h) {
  if (cfg.grain <= 0.01) return '';
  return `<rect width="${w}" height="${h}" filter="url(#grain)" opacity="${(cfg.grain * 0.45).toFixed(3)}" style="mix-blend-mode:overlay"/>`;
}

function vignetteDef(cfg) {
  if (cfg.vignette <= 0.01) return '';
  return `<radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="35%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="${(cfg.vignette * 0.7).toFixed(3)}"/>
    </radialGradient>`;
}

function vignetteRect(cfg, w, h) {
  if (cfg.vignette <= 0.01) return '';
  return `<rect width="${w}" height="${h}" fill="url(#vig)"/>`;
}

/**
 * feTurbulence writes a noisy alpha channel. Compositing it as-is renders the
 * layer at ~50% opacity — the single biggest fidelity bug found by the harness.
 */
function opaqueTransfer(inName = null, result = null) {
  const a = inName ? ` in="${inName}"` : '';
  const r = result ? ` result="${result}"` : '';
  return `<feComponentTransfer${a}${r}>
        <feFuncA type="linear" slope="0" intercept="1"/>
      </feComponentTransfer>`;
}

/**
 * Exposure lift. feTurbulence's value distribution is narrower than the engine's
 * after gamma correction, so the mapped result lands ~25% darker; this cancels it.
 * The constant is calibrated, not derived — see verify/out/report.md.
 */
function liftTransfer(slope = 1.22, intercept = 0.02) {
  return `<feComponentTransfer>
        <feFuncR type="linear" slope="${slope}" intercept="${intercept}"/>
        <feFuncG type="linear" slope="${slope}" intercept="${intercept}"/>
        <feFuncB type="linear" slope="${slope}" intercept="${intercept}"/>
        <feFuncA type="linear" slope="1" intercept="0"/>
      </feComponentTransfer>`;
}

/** Gamma/contrast expansion so feTurbulence uses the ramp's full range. */
function expandTransfer(slope = 1.7) {
  const intercept = ((1 - slope) / 2).toFixed(3);
  return `<feComponentTransfer>
        <feFuncR type="linear" slope="${slope}" intercept="${intercept}"/>
        <feFuncG type="linear" slope="${slope}" intercept="${intercept}"/>
        <feFuncB type="linear" slope="${slope}" intercept="${intercept}"/>
      </feComponentTransfer>`;
}

/* ------------------------------------------------------------------ mesh */

function meshSvg(cfg, w, h) {
  const L = meshLayout(cfg);
  const cols = rampColors(cfg, Math.min(5, Math.max(2, cfg.palette.length)));
  const ramp64 = rampColors(cfg, 64);
  const radius = (1.15 / L.cells) * Math.min(w, h);
  let defs = '';
  const items = [];

  L.nodes.forEach((nd, i) => {
    const c = ramp64[Math.round(nd.t * 63)];
    defs += `<radialGradient id="m${i}" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="${c}" stop-opacity="0.98"/>
      <stop offset="40%" stop-color="${c}" stop-opacity="0.62"/>
      <stop offset="72%" stop-color="${c}" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="${c}" stop-opacity="0"/>
    </radialGradient>`;
    items.push(
      `<ellipse cx="${(nd.x * w).toFixed(0)}" cy="${(nd.y * h).toFixed(0)}" rx="${radius.toFixed(0)}" ry="${radius.toFixed(0)}" fill="url(#m${i})"/>`,
    );
  });

  const d = dur(cfg, 34);
  const anim = d
    ? `<animateTransform attributeName="transform" type="translate" values="-2.2 -1.4; 2.2 1.8; -2.2 -1.4" dur="${d.toFixed(1)}s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>`
    : '';

  const body = `<defs>
    <linearGradient id="bg" x1="0" y1="0" x2="${Math.cos((cfg.direction * Math.PI) / 180).toFixed(3)}" y2="${Math.sin((cfg.direction * Math.PI) / 180).toFixed(3)}">
      ${cols.map((c, i) => `<stop offset="${((i / (cols.length - 1)) * 100).toFixed(1)}%" stop-color="${c}"/>`).join('')}
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="${(14 + cfg.blur * 34).toFixed(1)}"/>
    </filter>
    ${defs}
    ${vignetteDef(cfg)}
    ${grainFilter(cfg)}
  </defs>
  <rect width="${w}" height="${h}" fill="url(#bg)"/>
  <g filter="url(#soft)">${anim}${items.join('\n')}</g>
  ${vignetteRect(cfg, w, h)}
  ${grainRect(cfg, w, h)}`;

  return {
    body,
    approx: 'medium',
    notes: [
      `All ${L.nodes.length} lattice anchors placed at their true positions with the renderer's ramp colours; interpolation is approximated by a ${(14 + cfg.blur * 34).toFixed(0)} px Gaussian.`,
    ],
  };
}

/* ----------------------------------------------------------------- blobs */

function blobsSvg(cfg, w, h) {
  const L = blobLayout(cfg);
  const small = Math.min(w, h);
  let defs = '';
  const items = [];
  const d = dur(cfg, 26);

  L.items.forEach((b, i) => {
    const c = cfg.palette[Math.min(cfg.palette.length - 1, b.colorIdx)];
    const a = (b.alpha * (0.45 + cfg.intensity * 0.9)).toFixed(3);
    const r = b.radius * (0.55 + cfg.scale * 0.7) * small;
    defs += `<radialGradient id="b${i}">
      <stop offset="0%" stop-color="${c}" stop-opacity="${a}"/>
      <stop offset="38%" stop-color="${c}" stop-opacity="${(a * 0.5).toFixed(3)}"/>
      <stop offset="72%" stop-color="${c}" stop-opacity="${(a * 0.16).toFixed(3)}"/>
      <stop offset="100%" stop-color="${c}" stop-opacity="0"/>
    </radialGradient>`;
    const anim = d
      ? `<animateTransform attributeName="transform" type="translate" values="0 0; ${((b.orbit - 0.5) * 40).toFixed(1)} ${(Math.sin(b.phase) * 26).toFixed(1)}; 0 0" dur="${(d * (0.7 + b.pulseSpeed * 0.5)).toFixed(1)}s" repeatCount="indefinite"/>`
      : '';
    items.push(
      `<g>${anim}<circle cx="${(b.bx * w).toFixed(0)}" cy="${(b.by * h).toFixed(0)}" r="${r.toFixed(0)}" fill="url(#b${i})"/></g>`,
    );
  });

  const body = `<defs>
    ${defs}
    ${vignetteDef(cfg)}
    ${grainFilter(cfg)}
  </defs>
  <rect width="${w}" height="${h}" fill="${cfg.background}"/>

etContext('2d');\r\n  const r = size / 2;\r\n  const g = ctx.createRadialGradient(r, r, 0, r, r, r);\r\n  const [R, G, B] = rgb;\r\n  const inner = Math.max(0.001, 1 - softness);\r\n  g.addColorStop(0, `rgba(${R},${G},${B},1)`);\r\n  g.addColorStop(inner * 0.35, `rgba(${R},${G},${B},0.55)`);\r\n  g.addColorStop(inner, `rgba(${R},${G},${B},0.14)`);\r\n  g.addColorStop(1, `rgba(${R},${G},${B},0)`);\r\n  ctx.fillStyle = g;\r\n  ctx.fillRect(0, 0, size, size);\r\n\r\n  if (spriteCache.size > 64) spriteCache.clear();\r\n  spriteCache.set(key, c);\r\n  return c;\r\n}\r\n\r\n/**\r\n * Seeded grain tile: a balanced black/white speckle with per-pixel alpha.\r\n *\r\n * Opaque grey noise composited with `overlay` looks marginally better, but it\r\n * forces a full-frame blend that dominates the frame budget in software raster.\r\n * A transparent speckle drawn with `source-over` is ~10× cheaper and reads the\r\n * same at background amplitudes.\r\n */\r\nlet grainTile = null;\r\nlet grainSeed = -1;\r\n\r\nfunction getGrainTile(seed, size = 128) {\r\n  if (grainTile && grainSeed === seed) return grainTile;\r\n  const c = createCanvas(size, size);\r\n  const ctx = c.getContext('2d');\r\n  const img = ctx.createImageData(size, size);\r\n  let s = seed >>> 0 || 1;\r\n  const d = img.data;\r\n  for (let i = 0; i < d.length; i += 4) {\r\n    // xorshift32 — cheaper than a full PRNG in a 64k-pixel loop\r\n    s ^= s << 13;\r\n    s ^= s >>> 17;\r\n    s ^= s << 5;\r\n    const v = (s >>> 0) & 255;\r\n    d[i] = v;\r\n    d[i + 1] = v;\r\n    d[i + 2] = v;\r\n    d[i + 3] = 255;\r\n  }\r\n  ctx.putImageData(img, 0, 0);\r\n  grainTile = c;\r\n  grainSeed = seed;\r\n  return c;\r\n}\n\n/* ---- src/generators/layout.js ---- */\n/**\n * Shared layout: the single source of truth for *where things are*.\n *\n * Every export target must place the same anchors, blobs and motes as the canvas\n * renderer. The only honest way to guarantee that is to compute the layout once,\n * from one seeded phase, orbit, pulseSpeed, radius, colorIdx, alpha, coreScale });\n  }\n  return { count, items: out };\n}\n\n/* -------------------------------------------------------------- particles */\n\nfunction particleLayout(cfg) {\n  const count = 24 + Math.round(cfg.density * 280);\n  const rng = makeRng(hashSeed(cfg.seed, 'particles', count));\n  const dir = (cfg.direction * Math.PI) / 180;\n  const drift = 0.055 * (0.35 + cfg.intensity);\n  const out = [];\n  for (let i = 0; i < count; i++) {\n    const bx = rng.range(0, 1);\n    const by = rng.range(0, 1);\n    const ang = dir + rng.range(-0.55, 0.55);\n    const spd = drift * rng.range(0.35, 1.6);\n    const size = 0.8 + rng.next() * rng.next() * 3.6;\n    const colorIdx = 1 + Math.floor(rng.next() * 4);\n    const wobble = rng.range(0, TAU);\n    const wobbleAmp = rng.range(0.002, 0.012) * (0.3 + cfg.intensity);\n    out.push({ bx, by, ang, spd, size, colorIdx, wobble, wobbleAmp });\n  }\n  return { count, items: out, drift };\n}\n\n/* ------------------------------------------------------------------ field */\n\nfunction noiseParams(cfg) {\n  return {\n    freq: 0.95 / Math.max(0.4, cfg.scale),\n    secondFreq: 0.95 / Math.max(0.4, cfg.scale) * 1.72,\n    octaves: Math.max(2, Math.min(5, 2 + Math.round(cfg.density * 4))),\n    gamma: 1.55 - cfg.intensity * 0.95,\n    mid: 0.5 - (cfg.intensity - 0.5) * 0.22,\n    drift: 0.045,\n  };\n}\n\nfunction flowParams(cfg) {\n  return {\n    freq: 1.7 / Math.max(0.4, cfg.scale),\n    detailFreq: (1.7 / Math.max(0.4, cfg.scale)) * 1.28,\n    bands: 1 + cfg.density * 4.5,\n    warp: 0.35 + cfg.intensity * 1.15,\n  };\n}\n\nfunction textureParams(cfg) {\n  return {\n    freq: 1.05 / Math.max(0.4, cfg.scale),\n    stretch: 3.1,\n    strata: 3 + cfg.density * 11,\n    contrast: 0.4 + cfg.intensity * 1.6,\n  };\n}\n\n/** Colour for a palette index, clamped — exporters and renderers share this. */\nfunction paletteRgbAt(cfg, idx) {\n  const list = cfg.palette;\n  const i = Math.min(lis /* ---- src/export/canvasjs.js ---- */
/**
 * Canvas / JS export.
 *
 * The exported file is not a re-implementation: it embeds the same Renderer and
 * generator modules the studio runs (flattened by tools/gen-runtime.mjs), plus the
 * config as a literal. Fidelity is therefore 100% by construction — and the
 * verification harness proves it by diffing frames pixel-for-pixel.
 */





function buildCanvasExport(config) {
  const cfg = prepare(config);
  const json = serializeConfig(cfg);
  const title = `VeilForge · ${cfg.generator}`;

  const usage = `// 1. Serve veilforge-runtime.js next to your page (or inline it).
// 2. Drop a canvas in and hand it a config.
const bg = VeilForge.mount('#bg', ${json.replace(/\n/g, '\n')});

// Live updates: bg.setConfig({ ...config, speed: 0.8 });
// Teardown:     bg.destroy();`;

  const page = `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<meta name="generator" content="VeilForge ${RUNTIME_HASH}">
<style>
  html, body { margin: 0; height: 100%; background: ${cfg.background}; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .vf-content { position: relative; z-index: 2; display: grid; place-items: center;
    height: 100%; color: #fff; font: 600 clamp(22px, 4vw, 54px)/1.15 system-ui, sans-serif;
    letter-spacing: -0.02em; text-align: center; padding: 5vw; text-wrap: balance;
    text-shadow: 0 2px 40px rgba(0,0,0,.55); }
  @media (prefers-reduced-motion: reduce) { /* engine already freezes via matchMedia */ }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="vf-content">Your content sits here.<br>Drop it over the background.</div>
<script>
${RUNTIME_SOURCE}
<\/script>
<script>
(function () {
  var config = ${json};
  var host = document.getElementById('bg');
  var controller = window.VeilForge.mount(host, config);
  // Respect the user's motion preference even if the config says animate.
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    controller.renderer.reducedMotion = true;
    controller.renderer.drawAt(0);
  }
})();
<\/script>
</body>
</html>
`;

  return {
    format: 'canvas',
    mime: 'text/html',
    approx: 'exact',
    notes: [
      `Pixel-identical to the studio preview: the export embeds the same engine (runtime ${RUNTIME_HASH}).`,
      'Ship the whole file as-is, or keep veilforge-runtime.js external and use the snippet below.',
      `${(RUNTIME_SOURCE.length / 1024).toFixed(1)} KB unminified, 0 dependencies.`,
    ],
    files: [
      { name: `veilforge-${cfg.generator}.html`, mime: 'text/html', text: page },
      { name: 'veilforge-runtime.js', mime: 'text/javascript', text: RUNTIME_SOURCE },
      { name: 'veilforge-config.json', mime: 'application/json', text: json },
    ],
    snippet: usage,
    primary: `veilforge-${cfg.generator}.html`,
  };
}

/* ---- src/export/json.js ---- */
/**
 * Config (JSON) export and share-link encoding.
 *
 * Round-trip is guaranteed by `normalizeConfig`: parse(serialize(c)) deep-equals c
 * for every config the UI can produce, which the test suite asserts.
 */




function buildJsonExport(config, origin = '') {
  const cfg = prepare(config);
  const json = serializeConfig(cfg);
  const hash = encodeShareHash(cfg);
  const shareUrl = `${origin || 'https://example.com/veilforge/'}#${hash}`;

  return {
    format: 'json',
    mime: 'application/json',
    approx: 'exact',
    notes: [
      'Re-import this file in the studio to get the identical frame — every value is a literal, nothing is derived at load time.',
      `${shareUrl.length} characters of share URL encode the full config.`,
    ],
    files: [
      { name: `veilforge-${cfg.generator}.json`, mime: 'application/json', text: json },
    ],
    snippet: json,
    shareUrl,
    primary: `veilforge-${cfg.generator}.json`,
  };
}

/* ---- src/export/raster.js ---- */
/**
 * Raster export (PNG / WebP / JPEG).
 *
 * Uses Renderer.renderStill, which runs the real generator at the requested
 * resolution rather than upscaling the preview — so a 4K export is a true 4K
 * render, not a stretched 1600×900.
 */



const RASTER_PRESETS = {
  '1920×1080': [1920, 1080],
  '2560×1440': [2560, 1440],
  '3840×2160': [3840, 2160],
  '1200×630': [1200, 630],
  '1080×1350': [1080, 1350],
  '1080×1920': [1080, 1920],
};

/**
 * @param {import('../engine/renderer.js').Renderer} renderer
 */
async function buildRasterExport(renderer, config, { size = '1920×1080', format = 'image/png', quality = 0.92, time = 0.8 } = {}) {
  const cfg = prepare(config);
  const [w, h] = RASTER_PRESETS[size] || [1920, 1080];
  const canvas = renderer.renderStill(cfg, time, w, h);

  const blob = await new Promise((resolve) => canvas.toBlob(resolve, format, quality));
  if (!blob) throw new Error('Raster export failed: toBlob returned null');

  const ext = format === 'image/jpeg' ? 'jpg' : format === 'image/webp' ? 'webp' : 'png';
  return {
    format: 'raster',
    mime: format,
    approx: 'exact',
    notes: [
      `Rendered at ${w}×${h} from the generator, not upscaled from the preview.`,
      `${(blob.size / 1024).toFixed(0)} KB ${ext.toUpperCase()}.`,
    ],
    files: [{ name: `veilforge-${cfg.generator}-${w}x${h}.${ext}`, blob }],
    snippet: `// Programmatic equivalent:\n// renderer.renderStill(cfg, ${time}, ${w}, ${h}).toBlob(cb, '${format}', ${quality})`,
    primary: `veilforge-${cfg.generator}-${w}x${h}.${ext}`,
  };
}

function buildPosterExport(renderer, config, { size = '1920×1080', time = 0.8 } = {}) {
  const cfg = prepare(config);
  const [w, h] = RASTER_PRESETS[size] || [1920, 1080];
  const canvas = renderer.renderStill(cfg, time, w, h);

  return {
    format: 'poster',
    mime: 'text/html',
    approx: 'exact',
    notes: ['Inline base64 still + the full config — a no-JS fallback page.'],
    files: [
      {
        name: `veilforge-${cfg.generator}-poster.html`,
        mime: 'text/html',
        text: `<!doctype html><html><head><meta charset="utf-8"><title>VeilForge poster</title>
<style>html,body{margin:0;height:100%;background:${cfg.background} }
img{width:100%;height:100%;object-fit:cover;display:block}</style></head>
<body><img alt="Generated background" src="${canvas.toDataURL('image/webp', 0.9)}"></body></html>`,
      },
    ],
    snippet: '<img src="data:image/webp;base64,…">',
    primary: `veilforge-${cfg.generator}-poster.html`,
  };
}

/* ---- src/export/index.js ---- */
/**
 * Export dispatcher.
 *
 * Every target returns the same shape, so the UI renders one panel and the
 * harness can iterate `['css','svg','canvas','json']` without special cases:
 *
 *   { format, mime, approx, notes[], files[{name,mime,text|blob}], snippet, primary }
 */







const TARGETS = [
  { id: 'css', label: 'CSS', blurb: 'Zero JS. Layered gradients + feTurbulence.' },
  { id: 'svg', label: 'SVG', blurb: 'Vector, filter-based, SMIL animation.' },
  { id: 'canvas', label: 'Canvas / JS', blurb: 'The engine itself. Pixel-identical.' },
  { id: 'png', label: 'PNG / WebP', blurb: 'True-resolution still render.' },
  { id: 'json', label: 'Config', blurb: 'Round-trippable recipe + share link.' },
];

function buildExport(target, config, context = {}) {
  switch (target) {
    case 'css':
      return buildCssExport(config);
    case 'svg':
      return buildSvgExport(config);
    case 'canvas':
      return buildCanvasExport(config);
    case 'json':
      return buildJsonExport(config, context.origin);
    case 'png':
      return buildRasterExport(context.renderer, config, context.raster || {});
    default:
      throw new Error(`Unknown export target: ${target}`);
  }
}

/* ---- src/ui/dom.js ---- */
/** Tiny DOM helpers — no framework, no virtual DOM, no build step. */

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const child of children.flat()) {
    if (child === null || child === undefined || child === false) continue;
    node.appendChild(typeof child === 'string' || typeof child === 'number' ? document.createTextNode(String(child)) : child);
  }
  return node;
}

const $ = (sel, root = document) => root.querySelector(sel);

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
  return node;
}

function downloadFile(name, content, mime = 'text/plain') {
  const blob = content instanceof Blob ? content : new Blob([content], { type: `${mime};charset=utf-8` });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }
}

let toastTimer = 0;
function toast(message, kind = 'info') {
  let node = document.getElementById('vf-toast');
  if (!node) {
    node = el('div', { id: 'vf-toast', class: 'toast' });
    document.body.appendChild(node);
  }
  node.textContent = message;
  node.dataset.kind = kind;
  node.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove('show'), 2200);
}

function formatBytes(n) {
  if (n < 1024) return `${n} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1)} KB`;
  return `${(n / 1048576).toFixed(2)} MB`;
}

/**
 * Studio UI.
 *
 * Deliberately framework-free: the whole app is ~600 lines, loads with no build
 * step, and the only runtime dependency is the renderer itself. Controls are built
 * once and then synced, so dragging a slider never loses the pointer capture.
 */










const STORE_KEY = 'veilforge.presets.v1';
const SLIDER_ORDER = ['speed', 'density', 'direction', 'intensity', 'scale', 'grain', 'vignette', 'blur'];

function createApp(root) {
  const state = {
    config: initialConfig(),
    target: 'css',
    paused: false,
    result: null,
    rasterSize: '1920×1080',
    rasterFormat: 'image/png',
    activePane: 'params',
  };

  const refs = { sliders: {}, palette: [], seg: {} };

  /* ---------------------------------------------------------------- layout */

  const canvas = el('canvas', { id: 'preview', 'aria-label': 'Background preview' });
  const hud = el('div', { class: 'hud' });
  const rail = el('nav', { class: 'rail', 'aria-label': 'Generators' });
  const paramsPane = el('div', { class: 'pane', 'data-pane': 'params' });
  const palettePane = el('div', { class: 'pane', 'data-pane': 'palette' });
  const exportPane = el('div', { class: 'pane', 'data-pane': 'export' });
  const statusbar = el('footer', { class: 'statusbar' });
  const frame = el('div', { class: 'frame' }, canvas);
  const stage = el('section', { class: 'stage' }, frame, hud);

  const seedInput = el('input', { type: 'number', class: 'input seed-input', min: '1', step: '1', 'aria-label': 'Seed' });
  const aspectSelect = el('select', { class: 'input', 'aria-label': 'Aspect ratio' },
    ...Object.keys(ASPECTS).map((k) => el('option', { value: k }, k)));
  const qualitySelect = el('select', { class: 'input', 'aria-label': 'Quality' },
    ...['auto', 'low', 'medium', 'high', 'ultra'].map((k) => el('option', { value: k }, k)));
  const animToggle = el('input', { type: 'checkbox', class: 'switch', 'aria-label': 'Animate' });

  const shell = el('div', { class: 'app-shell' });
  root.append(shell);
  shell.append(
    el('header', { class: 'topbar' },
      el('div', { class: 'brand' },
        el('span', { class: 'mark' }, 'V'),
        el('span', { class: 'name' }, 'VeilForge'),
        el('span', { class: 'tag' }, 'studio')),
      el('div', { class: 'topbar-actions' },
        el('button', { class: 'btn', id: 'btn-random', title: 'R (randomize)' }, 'Randomize'),
        el('button', { class: 'btn', id: 'btn-reset', title: 'Reset to defaults' }, 'Reset'),
        el('button', { class: 'btn', id: 'btn-save' }, 'Save preset'),
        el('button', { class: 'btn', id: 'btn-load' }, 'Load'),
        el('button', { class: 'btn primary', id: 'btn-export' }, 'Export')),
    ),
    el('div', { class: 'body' },
      rail,
      stage,
      el('aside', { class: 'inspector' },
        el('div', { class: 'tabs', role: 'tablist' },
          ...[['params', 'Parameters'], ['palette', 'Palette'], ['export', 'Export']].map(([id, label]) =>
            el('button', { class: 'tab', role: 'tab', 'data-tab': id, id: `tab-${id}` }, label))),
        el('div', { class: 'panes' }, paramsPane, palettePane, exportPane))),
    statusbar,
  );

  const renderer = new Renderer(canvas, state.config);
  renderer.onStats = (s) => updateStatus(s);

  /* ------------------------------------------------------------------ rail */

  function buildRail() {
    clear(rail);
    for (const gen of GENERATORS) {
      const btn = el('button', { class: 'rail-item', 'data-gen': gen.id, title: gen.blurb },
        el('span', { class: 'rail-dot' }),
        el('span', { class: 'rail-label' }, gen.label));
      btn.addEventListener('click', () => {
        state.config = normalizeConfig({ ...state.config, generator: gen.id });
        renderer.setConfig(state.config);
        renderer.drawAt(0);
        syncAll();
        markExportDirty();
      });
      rail.appendChild(btn);
    }
  }

  /* -------------------------------------------------------------- params */

  function buildParams() {
    clear(paramsPane);

    const row = (label, control, hint) =>
      el('label', { class: 'field' },
        el('span', { class: 'field-label' }, label),
        control,
        hint ? el('span', { class: 'field-hint' }, hint) : null);

    for (const key of SLIDER_ORDER) {
      const spec = SLIDERS[key];
      const out = el('output', { class: 'val' });
      const input = el('input', {
        type: 'range', class: 'range', 'data-key': key,
        min: String(spec.min), max: String(spec.max), step: String(spec.step),
        'aria-label': spec.label,
      });
      input.addEventListener('input', () => {
        state.config = normalizeConfig({ ...state.config, [key]: Number(input.value) });
        out.textContent = fmt(key, state.config[key]);
        renderer.setConfig(state.config);
        renderer.drawAt(0);
        markExportDirty();
        updateStatus();
      });
      const wrap = el('div', { class: 'slider-row' }, input, out);
      refs.sliders[key] = { input, out };
      paramsPane.appendChild(
        el('div', { class: 'field' },
          el('div', { class: 'field-head' },
            el('span', { class: 'field-label' }, spec.label),
            el('span', { class: 'field-hint' }, spec.hint)),
          wrap),
      );
    }

    // Seed + dice
    seedInput.addEventListener('change', () => {
      state.config = normalizeConfig({ ...state.config, seed: Number(seedInput.value) || 1 });
      renderer.setConfig(state.config);
      renderer.drawAt(0);
      updateStatus();
      markExportDirty();
    });
    const dice = el('button', { class: 'btn icon', title: 'New seed' }, '⟳');
    dice.addEventListener('click', () => {
      state.config = normalizeConfig({ ...state.config, seed: randomSeed() });
      renderer.setConfig(state.config);
      renderer.drawAt(0);
      syncAll();
      markExportDirty();
    });

    paramsPane.appendChild(
      el('div', { class: 'section-head' }, 'Identity'),
      el('div', { class: 'field' },
        el('div', { class: 'field-head' }, el('span', { class: 'field-label' }, 'Seed')),
        el('div', { class: 'row' }, seedInput, dice)),
      el('div', { class: 'field' },
        el('div', { class: 'field-head' }, el('span', { class: 'field-label' }, 'Aspect')), aspectSelect),
      el('div', { class: 'field' },
        el('div', { class: 'field-head' }, el('span', { class: 'field-label' }, 'Render quality')),
        qualitySelect),
      el('div', { class: 'field inline' },
        el('span', { class: 'field-label' }, 'Animate'), animToggle),
      el('div', { class: 'preset-grid', id: 'presets' }),
    );

    aspectSelect.addEventListener('change', () => {
      state.config = normalizeConfig({ ...state.config, aspect: aspectSelect.value });
      applyAspect();
      renderer.drawAt(0);
      markExportDirty();
    });
    qualitySelect.addEventListener('change', () => {
      state.config = normalizeConfig({ ...state.config, quality: qualitySelect.value });
      renderer.setConfig(state.config);
      renderer.drawAt(0);
    });
    animToggle.addEventListener('change', () => {
      state.config = normalizeConfig({ ...state.config, animated: animToggle.checked });
      if (state.config.animated) {
        state.paused = false;
        renderer.start();
      } else {
        renderer.stop();
        renderer.drawAt(0);
      }
      updateStatus();
    });

    buildPresetGrid();
  }

  function buildPresetGrid() {
    const grid = paramsPane.querySelector('#presets');
    if (!grid) return;
    clear(grid);
    grid.appendChild(el('div', { class: 'section-head tight' }, 'Presets'));
    const wrap = el('div', { class: 'chips' });
    for (const preset of PRESETS) {
      const b = el('button', { class: 'chip', title: preset.name }, preset.name);
      b.addEventListener('click', () => applyPreset(preset));
      wrap.appendChild(b);
    }
    grid.appendChild(wrap);
  }

  /* ------------------------------------------------------------- palette */

  function buildPalette() {
    clear(palettePane);
    palettePane.appendChild(el('div', { class: 'section-head' }, 'Palette'));
    const list = el('div', { class: 'palette-list' });
    refs.palette = [];

    for (let i = 0; i < 5; i++) {
      const input = el('input', { type: 'color', class: 'color-input', 'aria-label': `Colour ${i + 1}` });
      const hex = el('input', { type: 'text', class: 'input hex', maxlength: '9', spellcheck: 'false' });
      input.addEventListener('input', () => {
        state.config.palette[i] = input.value;
        hex.value = input.value;
        commitPalette();
      });
      hex.addEventListener('change', () => {
        const v = hex.value.trim();
        if (!/^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(v)) {
          hex.value = state.config.palette[i];
          return;
        }
        state.config.palette[i] = v;
        input.value = v;
        commitPalette();
      });
      refs.palette.push({ input, hex });
      list.appendChild(el('div', { class: 'palette-row' }, input, hex));
    }

    const add = el('button', { class: 'btn small' }, '+ Add stop');
    add.addEventListener('click', () => {
      if (state.config.palette.length >= 6) return toast('Six stops is the practical maximum', 'warn');
      state.config.palette.push(state.config.palette[state.config.palette.length - 1]);
      buildPalette();
      syncPalette();
      commitPalette();
    });
    const remove = el('button', { class: 'btn small' }, '− Remove');
    remove.addEventListener('click', () => {
      if (state.config.palette.length <= 2) return toast('Two stops minimum', 'warn');
      state.config.palette.pop();
      buildPalette();
      syncPalette();
      commitPalette();
    });

    palettePane.appendChild(list);
    palettePane.appendChild(el('div', { class: 'row gap' }, add, remove));

    palettePane.appendChild(el('div', { class: 'section-head' }, 'Background'));
    const bg = el('input', { type: 'color', class: 'color-input wide' });
    bg.value = state.config.background;
    bg.addEventListener('input', () => {
      state.config.background = bg.value;
      commitPalette();
    });
    palettePane.appendChild(el('div', { class: 'palette-row' }, bg, el('span', { class: 'field-hint' }, 'Base under every layer')));

    palettePane.appendChild(el('div', { class: 'section-head' }, 'Curation'));
    const chips = el('div', { class: 'chips' });
    for (const p of PALETTES) {
      const b = el('button', { class: 'chip swatch', title: p.name },
        el('span', { class: 'swatch-dots' }, ...p.colors.slice(1).map((c) => el('i', { style: { background: c } }))),
        p.name);
      b.addEventListener('click', () => {
        state.config.palette = [...p.colors];
        state.config.background = p.background;
        syncPalette();
        commitPalette();
      });
      chips.appendChild(b);
    }
    palettePane.appendChild(chips);

    const gen = el('button', { class: 'btn' }, 'Generate harmonious palette');
    gen.addEventListener('click', () => {
      const p = randomPalette(randomSeed());
      state.config.palette = [...p.colors];
      state.config.background = p.background;
      syncPalette();
      commitPalette();
      toast('New palette — seed-locked', 'ok');
    });
    palettePane.appendChild(gen);
  }

  function syncPalette() {
    refs.palette.forEach((r, i) => {
      const c = state.config.palette[i] || '#000000';
      r.input.value = c;
      r.hex.value = c;
    });
    const bg = palettePane.querySelector('.color-input.wide');
    if (bg) bg.value = state.config.background;
  }

  function commitPalette() {
    state.config = normalizeConfig(state.config);
    renderer.setConfig(state.config);
    renderer.drawAt(0);
    updateStatus();
    markExportDirty();
  }

  /* -------------------------------------------------------------- export */

  let exportTimer = 0;
  function markExportDirty() {
    clearTimeout(exportTimer);
    exportTimer = setTimeout(() => {
      if (state.activePane === 'export') renderExport();
    }, 260);
  }

  /** Builds the export pane's static chrome. Named apart from the exporter it
   *  calls, because a same-named local would shadow the import inside createApp. */
  function buildExportPane() {
    clear(exportPane);
    const chips = el('div', { class: 'chips targets' });
    for (const t of TARGETS) {
      const b = el('button', { class: `chip target${state.target === t.id ? ' active' : ''}`, 'data-target': t.id, title: t.blurb }, t.label);
      b.addEventListener('click', () => {
        state.target = t.id;
        buildExportPane();
        renderExport();
      });
      chips.appendChild(b);
    }
    exportPane.appendChild(el('div', { class: 'section-head' }, 'Format'));
    exportPane.appendChild(chips);

    if (state.target === 'png') {
      const sizeSelect = el('select', { class: 'input' }, ...Object.keys(RASTER_PRESETS).map((k) => el('option', { value: k }, k)));
      sizeSelect.value = state.rasterSize;
      sizeSelect.addEventListener('change', () => {
        state.rasterSize = sizeSelect.value;
        renderExport();
      });
      const fmtSelect = el('select', { class: 'input' },
        el('option', { value: 'image/png' }, 'PNG'),
        el('option', { value: 'image/webp' }, 'WebP'),
        el('option', { value: 'image/jpeg' }, 'JPEG'));
      fmtSelect.value = state.rasterFormat;
      fmtSelect.addEventListener('change', () => {
        state.rasterFormat = fmtSelect.value;
        renderExport();
      });
      exportPane.appendChild(el('div', { class: 'row gap' }, sizeSelect, fmtSelect));
    }

    const out = el('div', { class: 'export-out', id: 'export-out' });
    exportPane.appendChild(out);
  }

  async function renderExport() {
    const out = exportPane.querySelector('#export-out');
    if (!out) return;
    clear(out);
    out.appendChild(el('div', { class: 'loading' }, 'Generating…'));

    try {
      const result = await buildExport(state.target, state.config, {
        renderer,
        origin: location.origin + location.pathname,
        raster: { size: state.rasterSize, format: state.rasterFormat },
      });
      state.result = result;
      clear(out);

      const cap = EXPORT_CAPABILITY[state.config.generator] || {};
      const declared = cap[state.target === 'png' ? 'canvas' : state.target];
      out.appendChild(
        el('div', { class: 'badge-row' },
          el('span', { class: `badge approx-${result.approx}` }, `fidelity: ${result.approx}`),
          declared && declared !== result.approx
            ? el('span', { class: 'badge muted' }, `generator ceiling: ${declared}`)
            : null),
      );

      if (result.notes?.length) {
        const ul = el('ul', { class: 'notes' });
        for (const n of result.notes) ul.appendChild(el('li', {}, n));
        out.appendChild(ul);
      }

      if (result.snippet) {
        const pre = el('pre', { class: 'code' }, result.snippet.length > 2600 ? result.snippet.slice(0, 2600) + '\n…' : result.snippet);
        const copy = el('button', { class: 'btn small' }, 'Copy');
        copy.addEventListener('click', async () => {
          const ok = await copyText(result.snippet);
          toast(ok ? 'Copied to clipboard' : 'Copy blocked by the browser', ok ? 'ok' : 'warn');
        });
        out.appendChild(el('div', { class: 'code-head' }, el('span', {}, 'Snippet'), copy));
        out.appendChild(pre);
      }

      const files = el('div', { class: 'files' });
      for (const f of result.files) {
        const size = f.blob ? f.blob.size : new Blob([f.text]).size;
        const btn = el('button', { class: 'file' },
          el('span', { class: 'file-name' }, f.name),
          el('span', { class: 'file-size' }, formatBytes(size)));
        btn.addEventListener('click', () => {
          if (f.blob) downloadFile(f.name, f.blob, f.mime);
          else downloadFile(f.name, f.text, f.mime);
          toast(`Saved ${f.name}`, 'ok');
        });
        files.appendChild(btn);
      }
      out.appendChild(el('div', { class: 'section-head tight' }, 'Files'));
      out.appendChild(files);

      const all = el('button', { class: 'btn primary wide' }, `Download all (${result.files.length})`);
      all.addEventListener('click', async () => {
        for (const f of result.files) {
          if (f.blob) downloadFile(f.name, f.blob, f.mime);
          else downloadFile(f.name, f.text, f.mime);
          await new Promise((r) => setTimeout(r, 220));
        }
        toast('All files saved', 'ok');
      });
      out.appendChild(all);
    } catch (err) {
      clear(out);
      out.appendChild(el('div', { class: 'error' }, `Export failed: ${err.message}`));
      console.error(err);
    }
  }

  /* ---------------------------------------------------------------- state */

  function initialConfig() {
    const fromHash = decodeShareHash(location.hash);
    return normalizeConfig(fromHash || DEFAULT_CONFIG);
  }

  function randomSeed() {
    return Math.floor(1 + Math.random() * 2 ** 31);
  }

  function applyPreset(preset) {
    const pal = paletteById(preset.palette);
    state.config = normalizeConfig({
      ...state.config,
      generator: preset.generator,
      palette: [...pal.colors],
      background: pal.background,
      ...preset.values,
    });
    renderer.setConfig(state.config);
    renderer.drawAt(0);
    syncAll();
    markExportDirty();
    toast(`${preset.name} applied`, 'ok');
  }

  function randomize() {
    const seed = randomSeed();
    const rng = makeRng(seed);
    const keepGen = rng.next() < 0.45;
    const gen = keepGen ? state.config.generator : rng.pick(GENERATORS).id;
    const pal = rng.next() < 0.45 ? rng.pick(PALETTES) : randomPalette(seed ^ 0x9e37);
    state.config = normalizeConfig({
      ...state.config,
      generator: gen,
      seed,
      palette: [...pal.colors],
      background: pal.background,
      speed: +rng.range(0.14, 0.78).toFixed(2),
      density: +rng.range(0.28, 0.86).toFixed(2),
      direction: Math.round(rng.range(0, 360)),
      intensity: +rng.range(0.45, 0.93).toFixed(2),
      scale: +rng.range(0.75, 1.75).toFixed(2),
      grain: +rng.range(0.06, 0.32).toFixed(2),
      vignette: +rng.range(0.12, 0.5).toFixed(2),
      blur: +rng.range(0.18, 0.52).toFixed(2),
    });
    renderer.setConfig(state.config);
    renderer.drawAt(0);
    syncAll();
    markExportDirty();
  }

  function syncAll() {
    for (const key of SLIDER_ORDER) {
      const r = refs.sliders[key];
      if (!r) continue;
      r.input.value = String(state.config[key]);
      r.out.textContent = fmt(key, state.config[key]);
    }
    seedInput.value = String(state.config.seed);
    aspectSelect.value = state.config.aspect;
    qualitySelect.value = state.config.quality;
    animToggle.checked = state.config.animated;
    syncPalette();
    applyAspect();
    for (const btn of rail.querySelectorAll('.rail-item')) {
      btn.classList.toggle('active', btn.dataset.gen === state.config.generator);
    }
    updateStatus();
  }

  /** Fit the preview canvas inside the stage box at the chosen aspect ratio. */
  function applyAspect() {
    const aspect = ASPECTS[state.config.aspect] || 16 / 9;
    const availW = Math.max(80, frame.clientWidth);
    const availH = Math.max(60, frame.clientHeight);
    let w = availW;
    let h = w / aspect;
    if (h > availH) {
      h = availH;
      w = h * aspect;
    }
    canvas.style.width = `${Math.round(w)}px`;
    canvas.style.height = `${Math.round(h)}px`;
    renderer.resize();
  }

  function fmt(key, value) {
    if (key === 'direction') return `${Math.round(value)}°`;
    if (key === 'grain' || key === 'vignette' || key === 'blur' || key === 'density' || key === 'intensity' || key === 'speed') {
      return `${Math.round(value * 100)}%`;
    }
    return Number(value).toFixed(2);
  }

  function updateStatus(stats) {
    const s = stats || renderer.stats();
    clear(statusbar);
    const items = [
      ['generator', state.config.generator],
      ['seed', state.config.seed],
      ['fps', s.fps],
      ['draw', `${s.drawMsP50} ms`],
      ['p95', `${s.drawMsP95} ms`],
      ['buffer', s.internal],
      ['scale', `×${s.renderScale}`],
      ['heap', s.heapMB ? `${s.heapMB} MB` : '—'],
    ];
    for (const [k, v] of items) {
      statusbar.appendChild(el('span', { class: 'stat' }, el('b', {}, String(v)), el('i', {}, k)));
    }
  }

  function updateHud() {
    clear(hud);
    hud.appendChild(el('span', { class: 'hud-chip' }, `${state.config.generator}`));
    hud.appendChild(el('span', { class: 'hud-chip' }, `seed ${state.config.seed}`));
    const share = el('button', { class: 'hud-chip btn-ghost', title: 'Copy share link' }, 'copy link');
    share.addEventListener('click', async () => {
      const url = `${location.origin}${location.pathname}#${encodeShareHash(state.config)}`;
      const ok = await copyText(url);
      toast(ok ? 'Share link copied' : 'Copy blocked', ok ? 'ok' : 'warn');
    });
    hud.appendChild(share);
  }

  /* --------------------------------------------------------------- events */

  document.getElementById('btn-random').addEventListener('click', randomize);
  document.getElementById('btn-reset').addEventListener('click', () => {
    state.config = normalizeConfig(DEFAULT_CONFIG);
    renderer.setConfig(state.config);
    renderer.drawAt(0);
    syncAll();
    markExportDirty();
    toast('Reset to defaults');
  });
  document.getElementById('btn-save').addEventListener('click', savePreset);
  document.getElementById('btn-load').addEventListener('click', loadPreset);
  document.getElementById('btn-export').addEventListener('click', () => {
    showPane('export');
    renderExport();
  });

  function showPane(id) {
    state.activePane = id;
    for (const tab of root.querySelectorAll('.tab')) tab.classList.toggle('active', tab.dataset.tab === id);
    for (const pane of root.querySelectorAll('.pane')) pane.classList.toggle('active', pane.dataset.pane === id);
    if (id === 'export') renderExport();
  }

  for (const tab of root.querySelectorAll('.tab')) {
    tab.addEventListener('click', () => showPane(tab.dataset.tab));
  }

  function savePreset() {
    const name = prompt('Preset name', `${state.config.generator} ${state.config.seed}`);
    if (!name) return;
    const all = readStore();
    all.unshift({ name, config: normalizeConfig(state.config), savedAt: Date.now() });
    localStorage.setItem(STORE_KEY, JSON.stringify(all.slice(0, 40)));
    toast(`Saved “${name}”`, 'ok');
  }

  function loadPreset() {
    const all = readStore();
    const rows = all.map((p, i) => `${i + 1}. ${p.name}  ·  ${p.config.generator}  ·  seed ${p.config.seed}`).join('\n');
    const answer = prompt(`Saved presets (enter a number, or "import" to paste JSON):\n\n${rows || '(none yet)'}`, all.length ? '1' : 'import');
    if (!answer) return;
    if (answer.trim().toLowerCase() === 'import') {
      const text = prompt('Paste a VeilForge config JSON:');
      if (!text) return;
      try {
        state.config = normalizeConfig(JSON.parse(text));
      } catch {
        return toast('That is not valid JSON', 'warn');
      }
    } else {
      const idx = parseInt(answer, 10) - 1;
      if (!all[idx]) return toast('No preset at that index', 'warn');
      state.config = normalizeConfig(all[idx].config);
    }
    renderer.setConfig(state.config);
    renderer.drawAt(0);
    syncAll();
    markExportDirty();
    toast('Preset loaded', 'ok');
  }

  function readStore() {
    try {
      return JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
    } catch {
      return [];
    }
  }

  document.addEventListener('keydown', (e) => {
    const tag = e.target?.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (e.key === 'r' || e.key === 'R') randomize();
    if (e.key === 'e' || e.key === 'E') {
      showPane('export');
      renderExport();
    }
    if (e.code === 'Space') {
      e.preventDefault();
      state.paused = !state.paused;
      if (state.paused) {
        renderer.fixedTime = renderer.fixedTime ?? 0;
        renderer.stop();
        renderer.drawAt(0);
      } else {
        renderer.fixedTime = null;
        renderer.start();
      }
      toast(state.paused ? 'Paused at t=0' : 'Playing');
    }
    if (e.key === 's' || e.key === 'S') {
      downloadFile('veilforge-config.json', serializeConfig(state.config), 'application/json');
      toast('Config saved');
    }
  });

  /* ------------------------------------------------------------------ boot */

  buildRail();
  buildParams();
  buildPalette();
  buildExportPane();
  syncAll();
  updateHud();
  showPane('params');

  renderer.resize();
  renderer.drawAt(0);
  if (state.config.animated) renderer.start();

  window.addEventListener('resize', () => {
    applyAspect();
    if (!renderer.running) renderer.drawAt(0);
  });

  const statTimer = setInterval(() => updateStatus(), 800);

  return {
    state,
    renderer,
    destroy() {
      clearInterval(statTimer);
      renderer.stop();
    },
  };
}

/* ---- src/main.js ---- */
const app = createApp(document.getElementById('app'));

// Exposed for the verification harness and for anyone poking at the console.
window.__veilforge = app;

const ready = () => document.documentElement.setAttribute('data-ready', '1');
if (document.readyState === 'complete') ready();
else window.addEventListener('load', ready);

</script>
